<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monitor_calidad_SIMEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F4F3FA;--surface:#FFFFFF;--surface-2:#EEF1F3;--surface-3:#E6E6E6;--border:#E6E6E6;--border-strong:#BABEC3;
  --text:#373737;--muted:#777778;--faint:#A2A2A2;
  --accent:#440099;--accent-ink:#FFFFFF;--sec:#FF6A13;
  --ok:#00966C;--warn:#FFC600;--warn-t:#8A6700;--err:#F12828;--cfg:#AC145A;--idle:#777778;
  --c1:#440099;--c2:#FF6A13;--c3:#AC145A;--c4:#2AD2C9;--c5:#00966C;
  --shadow:0 16px 40px rgba(55,55,55,.16);
  /* UI kit SIMEM */
  --primary-dark:#2F126A;--primary-100:#571D92;--primary-200:#672F9C;--primary-400:#8765B2;--primary-700:#CFC3DE;--primary-800:#F7F0FF;--primary-900:#F4F3FA;
  --secondary-700:#FEDCCB;--gray-300:#BABEC3;--gray-400:#D9D9D9;--gray-600:#EEF1F3;
  --title:#46049A;--head:"Nunito",system-ui,sans-serif;
  --ok-bg:#E8FCF7;--ok-ink:#007554;--warn-bg:#FEF6D7;--warn-ink:#8A6700;--err-bg:#FEE9E9;--err-ink:#B70000;--cfg-bg:#FFF0F7;--cfg-ink:#AC145A;--idle-bg:#EEF1F3;--idle-ink:#5F5F60;--info-bg:#F7F0FF;--info-ink:#440099;--blue-bg:#DBEFF5;--blue-ink:#006E8F;
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14101B;--surface:#1D1727;--surface-2:#251E31;--surface-3:#30283E;--border:#342C43;--border-strong:#4A4059;
  --text:#F2F0F5;--muted:#A9A3B3;--faint:#7C7589;
  --accent:#A57BFF;--accent-ink:#17082E;--sec:#FF8A47;
  --ok:#2FCB9B;--warn:#FFC600;--warn-t:#FFC600;--err:#FF6B6B;--cfg:#E0568F;--idle:#A2A2A2;
  --c1:#A57BFF;--c2:#FF8A47;--c3:#E0568F;--c4:#2AD2C9;--c5:#2FCB9B;
  --shadow:0 16px 40px rgba(0,0,0,.5);
  --title:#CDB6FF;--head:"Nunito",system-ui,sans-serif;--primary-800:#2B2040;--primary-900:#251E31;--primary-100:#B795FF;--gray-600:#251E31;--gray-300:#4A4059;
  --ok-bg:rgba(47,203,155,.16);--ok-ink:#2FCB9B;--warn-bg:rgba(255,198,0,.16);--warn-ink:#FFC600;--err-bg:rgba(255,107,107,.16);--err-ink:#FF8A8A;--cfg-bg:rgba(224,86,143,.18);--cfg-ink:#F07BAA;--idle-bg:rgba(162,162,162,.16);--idle-ink:#BDB8C6;--info-bg:rgba(165,123,255,.18);--info-ink:#C9B3FF;--blue-bg:rgba(75,184,217,.16);--blue-ink:#7FD3EC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14101B;--surface:#1D1727;--surface-2:#251E31;--surface-3:#30283E;--border:#342C43;--border-strong:#4A4059;
  --text:#F2F0F5;--muted:#A9A3B3;--faint:#7C7589;
  --accent:#A57BFF;--accent-ink:#17082E;--sec:#FF8A47;
  --ok:#2FCB9B;--warn:#FFC600;--warn-t:#FFC600;--err:#FF6B6B;--cfg:#E0568F;--idle:#A2A2A2;
  --c1:#A57BFF;--c2:#FF8A47;--c3:#E0568F;--c4:#2AD2C9;--c5:#2FCB9B;
  --shadow:0 16px 40px rgba(0,0,0,.5);
  --title:#CDB6FF;--head:"Nunito",system-ui,sans-serif;--primary-800:#2B2040;--primary-900:#251E31;--primary-100:#B795FF;--gray-600:#251E31;--gray-300:#4A4059;
  --ok-bg:rgba(47,203,155,.16);--ok-ink:#2FCB9B;--warn-bg:rgba(255,198,0,.16);--warn-ink:#FFC600;--err-bg:rgba(255,107,107,.16);--err-ink:#FF8A8A;--cfg-bg:rgba(224,86,143,.18);--cfg-ink:#F07BAA;--idle-bg:rgba(162,162,162,.16);--idle-ink:#BDB8C6;--info-bg:rgba(165,123,255,.18);--info-ink:#C9B3FF;--blue-bg:rgba(75,184,217,.16);--blue-ink:#7FD3EC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;padding:16px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-mark .i{width:18px;height:18px}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
.nav a.on .i{color:var(--accent)}
.nav a kbd{margin-left:auto}
.nav a .badge{margin-left:auto;font:500 11px var(--mono);padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--err) 20%,transparent);color:var(--err)}
.nav a .badge + kbd{margin-left:6px}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);color:var(--muted);cursor:pointer;text-align:left}
.search span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.proto{font-size:11.5px;color:var(--warn-t);border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent);border-radius:999px;padding:2px 10px;white-space:nowrap}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--err);border:2px solid var(--bg)}
.date-in{height:36px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);padding:0 8px;font-family:var(--mono);font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--sans);background:var(--surface-3);color:var(--text);flex:none}
.avatar.sm{width:22px;height:22px;font-size:10px}
.view{padding:24px;display:flex;flex-direction:column;gap:20px}

/* Common */
kbd{font:500 11px var(--mono);padding:0 5px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface-2);line-height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn kbd{margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap;line-height:18px}
.chip .i{width:13px;height:13px}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.chip.warn{color:var(--warn-t);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.chip.err{color:var(--err);background:color-mix(in srgb,var(--err) 15%,transparent)}
.chip.cfg{color:var(--cfg);background:color-mix(in srgb,var(--cfg) 16%,transparent)}
.chip.idle{color:var(--idle);background:color-mix(in srgb,var(--idle) 16%,transparent)}
.chip.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.sev::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.sev.crit{color:var(--err);font-weight:600}.sev.alta{color:var(--warn-t);font-weight:500}.sev.media{color:var(--muted)}.sev.baja{color:var(--faint)}
.tag{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--border-strong);padding:0 6px;border-radius:4px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-h h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-h small{color:var(--muted);font-size:12px}
.panel-b{padding:16px}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vh h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.vh p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.vh-act{display:flex;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.hl td{background:color-mix(in srgb,var(--warn) 7%,transparent)}
.tbl tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tbl tr.click{cursor:pointer}
.tbl .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.sub-note{display:flex;align-items:center;gap:5px;color:var(--warn-t);font-size:12px;margin-top:2px}
.sub-note .i{width:13px;height:13px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.in{height:36px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface-2);padding:0 10px;min-width:0;width:100%}
textarea.in{height:auto;padding:10px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--surface-3);color:var(--text);font-weight:500}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.kpi-v{font:500 28px/1.15 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12px;color:var(--muted)}
.kpi-s.up{color:var(--ok)}
.kpi.warn .kpi-l .i{color:var(--warn-t)}.kpi.err .kpi-l .i{color:var(--err)}.kpi.cfg .kpi-l .i{color:var(--cfg)}.kpi.ok .kpi-l .i{color:var(--ok)}
.kpi.warn .kpi-v{color:var(--warn-t)}.kpi.err .kpi-v{color:var(--err)}.kpi.cfg .kpi-v{color:var(--cfg)}

/* Torre */
.torre{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.torre-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.col-h{padding:12px 14px;border-bottom:1px solid var(--border)}
.col-h h3{margin:0;display:flex;align-items:center;gap:8px;font-size:14px}
.col-h h3 .n{margin-left:auto;font:500 13px var(--mono);color:var(--muted)}
.col-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.col.warn h3 .i{color:var(--warn-t)}.col.err h3 .i{color:var(--err)}.col.cfg h3 .i{color:var(--cfg)}
.col-b{padding:8px;display:flex;flex-direction:column;gap:6px;max-height:430px;overflow-y:auto}
.icard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);cursor:pointer}
.icard:hover{border-color:var(--border-strong);background:var(--surface-3)}
.icard b{font-weight:500;font-size:13.5px;line-height:1.3}
.icard .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted)}
.icard .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.icard .who.free{color:var(--faint);font-style:italic}
.strip-row{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 64px;gap:12px;align-items:center;padding:6px 0}
.strip-row + .strip-row{border-top:1px solid var(--border)}
.strip-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px}
.strip i{height:22px;border-radius:2px;display:block}
.strip i.ok{background:color-mix(in srgb,var(--ok) 70%,var(--surface))}
.strip i.warn{background:var(--warn)}
.strip i.err{background:var(--err)}
.strip-pct{text-align:right;font:500 13px var(--mono)}
.strip-axis{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 64px;gap:12px;font:11px var(--mono);color:var(--faint)}
.strip-axis div:nth-child(2){display:flex;justify-content:space-between}
.aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.digest ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.digest li{display:flex;gap:10px;font-size:13px;line-height:1.45}
.digest li .i{margin-top:2px}
.digest li.err .i{color:var(--err)}.digest li.warn .i{color:var(--warn-t)}.digest li.cfg .i{color:var(--cfg)}.digest li.ok .i{color:var(--ok)}
.digest-meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.next-list{display:flex;flex-direction:column;gap:8px;font-size:13px}
.next-list div{display:flex;justify-content:space-between;gap:10px}
.next-list span:last-child{font-family:var(--mono);color:var(--muted);font-size:12px}

/* Torre: KPIs en fila y tabs */
.kpis-row{grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px;border-bottom:1px solid var(--border)}
.tab{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab[data-tab="warn"] .i{color:var(--warn-t)}.tab[data-tab="err"] .i{color:var(--err)}.tab[data-tab="cfg"] .i{color:var(--cfg)}
.tab .n{font:600 12px var(--mono);padding:0 7px;border-radius:999px;background:var(--surface-3);color:var(--text)}
@media (max-width:1180px){.kpis-row{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}

.filters.trz .in{background:var(--surface)}
.inc.solo{grid-template-columns:minmax(0,1fr)}
.inc-hdr{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.ih-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 20px;align-items:flex-start}
.ih-title{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start}
.ih-title h1{margin:0;font-size:21px;font-weight:700}
.ih-act{display:flex;align-items:flex-end;gap:10px}
.ih-act .in{width:210px;background:var(--surface)}
.ih-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 24px;margin:0;padding-top:14px;border-top:1px solid var(--border)}
.ih-meta dt{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.ih-meta dd{margin:0;font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.kebab-wrap{position:relative}
.kebab{border:1px solid var(--border-strong);background:var(--surface)}
.kmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:270px;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.kmenu button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;border-radius:6px;text-align:left;cursor:pointer;font-size:13.5px}
.kmenu button:hover{background:var(--surface-2)}
.tbl th.num{font-family:var(--sans)}
/* Incidentes */
.inc{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.inc-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px}
.inc-list h3{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inc-item{display:flex;flex-direction:column;gap:4px;text-align:left;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer}
.inc-item:hover{background:var(--surface-2)}
.inc-item.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.inc-item b{font-weight:500;font-size:13px}
.inc-item .row{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.inc-detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.inc-head{display:flex;flex-direction:column;gap:10px}
.inc-head h1{margin:0;font-size:21px;font-weight:600}
.inc-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--muted)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow-node{flex:1;min-width:150px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.flow-node b{font-size:13px;display:flex;align-items:center;gap:6px}
.flow-node span{font:12px var(--mono);color:var(--muted)}
.flow-node.bad{border-color:var(--err);background:color-mix(in srgb,var(--err) 10%,var(--surface))}
.flow-node.bad b{color:var(--err)}
.flow-node.good b .i{color:var(--ok)}
.flow-arrow{display:grid;place-items:center;width:36px;color:var(--faint)}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.step{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint);padding:4px 10px 4px 6px;border-radius:999px;border:1px solid var(--border)}
.step i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--mono);font-style:normal;background:var(--surface-3);color:var(--muted)}
.step.done{color:var(--muted)}
.step.done i{background:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.step.cur{color:var(--text);border-color:var(--accent);font-weight:500}
.step.cur i{background:var(--accent);color:var(--accent-ink)}
.assign{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.assign-who{display:flex;align-items:center;gap:8px;font-size:13px}
.inc-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inc-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.diff td.bad{background:color-mix(in srgb,var(--err) 13%,transparent)!important}
.diff td.bad.src{background:color-mix(in srgb,var(--ok) 11%,transparent)!important}
.diff .delta.bad{color:var(--err);font-weight:500}
.diff-sum{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{justify-content:flex-start;height:auto;min-height:38px;padding:8px 12px;white-space:normal;text-align:left}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--border-strong)}
.tl li:last-child::before{display:none}
.tl li>i{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:3px}
.tl li.sys>i{border-color:var(--faint)}
.tl li.bad>i{border-color:var(--err)}
.tl li.good>i{border-color:var(--ok)}
.tl .t{font-size:13px}
.tl .m{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.comment{display:flex;gap:8px;margin-top:4px}
.comment .in{flex:1}
.code{font:12.5px/1.65 var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;white-space:pre;margin:0}
.code .del{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err);display:inline-block;min-width:100%}
.code .add{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:inline-block;min-width:100%}

/* Oportunidad */
.floatbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:10px;background:var(--surface-3);border:1px solid var(--border-strong);box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.floatbar b{font-weight:600;margin-right:6px}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s linear}
.prog.done i{background:var(--ok)}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.prog-row .prog{grid-column:1/-1}
.prog-row span:nth-child(2){text-align:right;font:12px var(--mono);color:var(--muted)}
.check-line{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:13px}
.check-line input{margin-top:2px}
.check-line small{display:block;color:var(--muted);font-size:12px}

/* Versiones */
.vfilters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.vfilters .field{min-width:200px;flex:1 1 200px;max-width:280px}
.vcount{font-size:12.5px;margin-left:auto;align-self:center}
.vsum{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:8px;border:1px solid var(--border);border-left-width:4px;background:var(--surface)}
.vsum.bad{border-left-color:var(--err)}.vsum.good{border-left-color:var(--ok)}
.vsum-main{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
.vsum.bad .vsum-main .i{color:var(--err)}.vsum.good .vsum-main .i{color:var(--ok)}
.vsum-main .i{width:22px;height:22px}
.vsum-sub{display:flex;flex-wrap:wrap;gap:6px}
.vm-wrap{overflow:auto;max-height:min(620px,70vh)}
table.vm{border-collapse:separate;border-spacing:0;font-size:12px}
.vm th,.vm td{padding:2px}
.vm thead th{position:sticky;top:0;z-index:3;background:var(--surface);font:600 11px var(--mono);color:var(--muted);text-align:center;padding:6px 0 6px;border-bottom:1px solid var(--border)}
.vm thead th.we{color:var(--faint)}
.vm th .wd{display:block;font-weight:400;color:var(--faint)}
.vm th.rh{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 14px 4px 12px;min-width:290px;max-width:290px;border-right:1px solid var(--border);font:600 13px var(--sans);color:var(--text);white-space:nowrap}
.vm thead th.rh{z-index:4;font-size:12px;color:var(--muted);font-weight:600}
.vm th.rh .rn{display:block;overflow:hidden;text-overflow:ellipsis}
.vm th.rh small{display:block;font:400 11px var(--sans);color:var(--muted)}
.vm th.rh .mf{color:var(--err);font-weight:700}
.vm tbody tr:hover th.rh{background:var(--surface-2)}
.vcell{width:30px;height:30px;border-radius:5px;border:0;display:grid;place-items:center;padding:0;cursor:pointer;margin:0 auto}
.vcell .i{width:14px;height:14px;stroke-width:2.5}
.vcell.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.vcell.miss{background:var(--err);color:#fff}
.vcell.late{background:color-mix(in srgb,var(--warn) 70%,transparent);color:#4A3600}
.vcell.pend{background:var(--surface-3);color:var(--muted);border:1px dashed var(--faint)}
.vcell.none{background:transparent;color:var(--faint);cursor:default;font-size:14px;line-height:1}
button.vcell:hover{outline:2px solid var(--text);outline-offset:1px}
button.vcell.pick{outline:3px solid var(--accent);outline-offset:1px}
.vleg{gap:8px 18px}
.lgi{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.lgi .vcell{width:20px;height:20px;border-radius:4px;margin:0;cursor:default}
.lgi .vcell .i{width:12px;height:12px}
.vtip{position:fixed;z-index:70;max-width:300px;padding:8px 10px;border-radius:6px;background:var(--text);color:var(--bg);font-size:12px;line-height:1.4;display:flex;flex-direction:column;gap:2px;pointer-events:none;box-shadow:var(--shadow)}
.vtip[hidden]{display:none}
.vtip .t-err{font-weight:700;text-decoration:underline}
.lg-cell{width:14px;height:14px;border-radius:3px;display:inline-block}

/* Validación */
.cfgband{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px}
.cfgi{display:flex;flex-direction:column;gap:3px;min-width:0}
.cfgi span{font-size:12px;color:var(--muted);font-weight:600}
.cfgi b{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.vkpis{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.vkpis .kpi{padding:10px 16px}.vkpis .kpi-v{font-size:24px}
.valtbl th small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.idp{display:inline-block;margin-right:8px;font-size:12.5px}
.na{color:var(--muted);font-style:italic;font-family:var(--sans);font-size:12px}
.tbl td.dfv{color:var(--err);font-weight:700}
.solbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:600}
.solbtn.yes{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.solbtn.no{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
.solbtn:hover{border-color:currentColor}
.vstate{display:flex;gap:10px;align-items:center;padding:14px 16px;border:1px dashed var(--border-strong);border-radius:8px;color:var(--muted);font-size:13px}
.vstate b{color:var(--text)}
.vstate.err{border-style:solid;border-color:color-mix(in srgb,var(--err) 55%,transparent);background:color-mix(in srgb,var(--err) 8%,transparent);color:var(--text)}
.vstate.err .i{color:var(--err)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
input[aria-invalid="true"]{border-color:var(--err)}

/* Detalle de versión (panel derecho) */
.drawer.ver{width:min(540px,100%)}
.drawer.ver .modal-b{gap:10px;padding:14px 18px}
.vd-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vd-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:0}
.vd-meta dt{font-size:12px;color:var(--muted);font-weight:600}
.vd-meta dd{margin:0;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.vd-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.vd-sum>div{border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.vd-sum b{font:600 20px/1.1 var(--mono)}
.vd-sum .ok b{color:var(--ok)}.vd-sum .bad{border-color:color-mix(in srgb,var(--err) 50%,transparent)}.vd-sum .bad b{color:var(--err)}
.vd-sum span{font-size:12px;color:var(--muted);font-weight:600}
.vd-sum em{font-style:normal;font-size:12px;overflow-wrap:anywhere}
.vd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vd-list li{border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.vd-list li.miss{border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.vl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vl-h .chip{margin-left:auto}
.vl-d{font-size:12px}
.vl-s{display:flex;gap:8px;font-size:12px;align-items:flex-start;margin-top:2px}
.vl-s.found .i{color:var(--ok)}.vl-s.gone .i{color:var(--err)}
.vd-note{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--info-bg);color:var(--text);font-size:12.5px;line-height:17px}.vd-note .i{color:var(--accent);margin-top:1px}
.drawer.ver .vd-sum>div{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;padding:6px 10px}.drawer.ver .vd-sum b{font-size:17px}.drawer.ver .vd-sum em{grid-column:1/-1}
.drawer.ver .vd-list li{padding:7px 10px}.drawer.ver .modal-b{gap:8px}
.vl-opt{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;cursor:pointer;color:var(--text)}.vl-opt i{font-style:normal;color:var(--muted)}
.vl-s code{display:block;font:11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
/* Indicadores */
.igrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.igrid .wide{grid-column:1/-1}
.hbar{display:grid;grid-template-columns:70px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--c1);border-radius:3px}
.hbar span:last-child{text-align:right;font-family:var(--mono)}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font:10.5px var(--mono);color:var(--faint);align-items:center}
.heat i{height:18px;border-radius:2px;display:block}
.heat .hx{text-align:center}
.explorer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start}
.answer{border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.answer.err{border-color:color-mix(in srgb,var(--err) 60%,transparent)}
.answer.ok{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.answer.warn{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.answer b{font-size:15px}
.answer p{margin:0;font-size:13px;color:var(--muted)}
.spark{width:90px;height:24px;display:block}

/* Indicadores nuevos */
.dsel-row{display:flex;flex-wrap:wrap;gap:8px}
.dsel{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.dsel i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dsel[aria-pressed="true"]{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:var(--accent)}
.dsel[aria-pressed="true"]::after{content:"✓";font-size:12px;color:var(--accent)}
.lgk{display:inline-flex;align-items:center;gap:6px}
.axlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.chartbox{overflow-x:auto}
.chartbox .chart{min-width:560px}
.pt{fill:transparent;stroke:none;cursor:pointer}
.pt:hover,.pt:focus{stroke:var(--text);stroke-width:2;outline:none}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .ch{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.ccell{position:relative;min-height:50px;border-radius:6px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ccell b{position:absolute;top:3px;left:5px;font-size:10.5px;font-weight:700}
.ccell .i{width:16px;height:16px;stroke-width:2.5}
.ccell.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.ccell.ok b{color:var(--text)}
.ccell.miss{background:var(--err);color:#fff}
.ccell.fut{background:var(--surface-3);color:var(--muted);border:1px dashed var(--faint)}
.ccell.pick{outline:3px solid var(--accent);outline-offset:1px}
.ccell:hover{outline:2px solid var(--text);outline-offset:1px}
.ccell.mini{display:inline-flex;width:20px;height:20px;min-height:0;cursor:default;position:static}
.ccell.mini .i{width:12px;height:12px}
.ccell.mini:hover{outline:none}
.calsel{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:13px}

.rangebar{position:sticky;top:57px;z-index:15;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(55,55,55,.08)}
.rangebar>b{align-self:center;font-size:13px}
.rb{flex-direction:row;align-items:center}
.rb .in{width:160px;background:var(--surface)}
.rb-note{font-size:12.5px;align-self:center;margin-left:auto}
.chart-ctl{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.ddwrap{position:relative;display:flex;flex-direction:column;gap:6px}
.ddlab{font-size:12px;color:var(--muted);font-weight:600}
.ddbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:280px;max-width:100%;text-align:left;cursor:pointer;background:var(--surface)}
.ddbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddmenu{position:absolute;top:100%;left:0;z-index:30;margin-top:4px;width:320px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.ddmenu{gap:8px;width:360px}.ddmenu .in{width:100%}.dd-act{display:flex;gap:6px;flex-wrap:wrap}.dd-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:4px}.dd-foot{font-size:12px;padding:0 2px}.ddn{display:flex;flex-direction:column;line-height:1.25}.ddn small{color:var(--muted);font-size:11.5px}
.ddchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.ddchips:empty{display:none}.ddchips .chip button{border:0;background:transparent;cursor:pointer;color:inherit;font-size:15px;line-height:1;padding:0 0 0 4px}
.ddi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.ddi:hover{background:var(--surface-2)}
.ddi i{width:10px;height:10px;border-radius:50%;flex:none}
.ddi.all{border-bottom:1px solid var(--border);border-radius:6px 6px 0 0;font-weight:700;margin-bottom:4px}
.ind-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>.panel:last-child{flex:1}
.calpanel .ccell{min-height:42px}
.calpanel .calgrid{gap:3px}
.explorer{grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:24px;align-items:start}
.exp-l,.exp-r{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:980px){.ind-row2{grid-template-columns:minmax(0,1fr)}.rb-note{margin-left:0}}
@media (max-width:760px){.rangebar{top:0;position:static}}
.tipo{display:inline-flex;align-items:center;gap:7px}
.tipo.warn .i{color:var(--warn-t)}.tipo.err .i{color:var(--err)}.tipo.cfg .i{color:var(--cfg)}
/* Config */
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked + span{background:var(--accent);border-color:var(--accent)}
.switch input:checked + span::after{transform:translateX(14px);background:var(--accent-ink)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.wz-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:18px}
.wz-steps div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--faint)}
.wz-steps div::before{content:"";height:4px;border-radius:2px;background:var(--surface-3)}
.wz-steps div.done{color:var(--muted)}
.wz-steps div.done::before{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.wz-steps div.cur{color:var(--text);font-weight:500}
.wz-steps div.cur::before{background:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.rules{display:flex;flex-direction:column;gap:6px}
.rule{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:13px}
.rule .tag{margin-left:auto}
.result-box{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:6px;font-size:13px}
.result-box.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}

/* Overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,10,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.modal{width:min(640px,100%);max-height:84vh;overflow:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow)}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h2{margin:0;font-size:16px;font-weight:600}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}
.drawer-scrim{position:fixed;inset:0;z-index:45;background:rgba(5,10,15,.4)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:46;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer .modal-b{overflow-y:auto;flex:1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.src-list{display:flex;flex-direction:column;gap:8px}
.src-item{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.src-item small{display:block;color:var(--muted);font:12px var(--mono);overflow-wrap:anywhere}
.src-item.found{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.src-item.found>.i{color:var(--ok)}
.src-item.gone>.i{color:var(--err)}
.palette{width:min(560px,100%);background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.palette-in{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
.palette-in input{flex:1;height:48px;border:0;background:transparent;outline:none;font-size:15px}
.palette ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow-y:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13.5px}
.palette li small{margin-left:auto;color:var(--faint);font-size:12px}
.palette li.on{background:var(--surface-3)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--surface-3);border:1px solid var(--border-strong);box-shadow:var(--shadow);font-size:13px;animation:tin .2s ease-out}
.toast .i{color:var(--ok)}.toast.bad .i{color:var(--err)}
@keyframes tin{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.notif{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.notif small{display:block;color:var(--muted);font:11.5px var(--mono);margin-top:2px}

/* Responsive */
@media (max-width:1180px){
  .torre{grid-template-columns:minmax(0,1fr)}
  .aside{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .inc-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .inc{grid-template-columns:minmax(0,1fr)}
  .inc-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .inc-list h3{display:none}
  .inc-item{min-width:220px}
  .igrid,.explorer{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:0 8px 0 0}
  .brand div{display:none}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap}
  .nav a kbd,.side-foot{display:none}
  .top{padding:10px 16px}
  .view{padding:16px}
  .proto,.date-in,.search kbd{display:none}
  .strip-row,.strip-axis{grid-template-columns:minmax(0,1fr) 56px}
  .strip-row .strip{grid-column:1/-1;grid-row:2}
  .strip-axis div:first-child{display:none}
  .strip-axis div:nth-child(2){grid-column:1/-1}
  .strip-axis div:last-child{display:none}
  .actions,.form-grid{grid-template-columns:minmax(0,1fr)}
  .flow-arrow{transform:rotate(90deg);width:100%;height:24px}
  .flow{flex-direction:column}
}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=(n,d=1)=>Number(n).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});

const DIA=['D','L','M','M','J','V','S'];

const dLabel=iso=>{const d=new Date(iso+'T12:00:00');return d.getDate()+' '+MES[d.getMonth()]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Gráficas ---------- */
function lineChart({series,labels,min,max,w=640,h=220,marks=[],area=false,fy=v=>fmt(v,0),ticks=4}){
  const L=46,R=16,T=12,B=26,iw=w-L-R,ih=h-T-B,n=labels.length;
  const x=i=>L+(n===1?iw/2:i*iw/(n-1)), y=v=>T+ih-(v-min)/(max-min)*ih;
  let g='';
  for(let k=0;k<=ticks;k++){const v=min+(max-min)*k/ticks,yy=y(v).toFixed(1);g+=`<line x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-8}" y="${+yy+4}" class="ax" text-anchor="end">${fy(v)}</text>`}
  const step=Math.max(1,Math.ceil(n/7));
  labels.forEach((l,i)=>{if(i%step===0||i===n-1){if(i!==n-1&&n-1-i<step*.6)return;const a=i===0?'start':i===n-1?'end':'middle';g+=`<text x="${x(i).toFixed(1)}" y="${h-7}" class="ax" text-anchor="${a}">${l}</text>`}});
  series.forEach(s=>{
    const d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('');
    if(area)g+=`<path d="${d}L${x(n-1).toFixed(1)},${T+ih}L${x(0)},${T+ih}Z" style="fill:${s.color};opacity:.13"/>`;
    g+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
    g+=`<circle cx="${x(n-1).toFixed(1)}" cy="${y(s.values[n-1]).toFixed(1)}" r="3.5" style="fill:${s.color}"/>`;
  });
  marks.forEach(m=>{g+=`<circle cx="${x(m.i).toFixed(1)}" cy="${y(m.v).toFixed(1)}" r="7" style="fill:none;stroke:var(--err);stroke-width:2"/><circle cx="${x(m.i).toFixed(1)}" cy="${y(m.v).toFixed(1)}" r="3" style="fill:var(--err)"/>`});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}
function spark(vals,color='var(--c1)'){const w=90,h=24,mn=Math.min(...vals),mx=Math.max(...vals),n=vals.length;const p=vals.map((v,i)=>(i?'L':'M')+(2+i*(w-4)/(n-1)).toFixed(1)+','+(h-3-(v-mn)/((mx-mn)||1)*(h-6)).toFixed(1)).join('');return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${p}" style="fill:none;stroke:${color};stroke-width:1.6"/></svg>`}
function series30(seed,base,amp,endIso,noise=.08){const r=rng(seed);const out=[],lab=[];for(let i=29;i>=0;i--){const iso=addDays(endIso,-i);lab.push(dLabel(iso));const k=29-i;out.push(+(base+amp*Math.sin(k/4.2+seed%7)+base*noise*(r()-.5)).toFixed(1))}return{vals:out,labels:lab}}

function diffRows(inc){
  const r=rng(inc.id.length*97+inc.set.length);
  const bad=inc.id==='INC-2026-0412'?{14:'zero',15:'zero',16:'dup',17:'miss'}:{9:'zero',10:'x10',18:'miss'};
  const base=inc.id==='INC-2026-0412'?95:400;
  const rows=[];let prev=0;
  for(let h=1;h<=24;h++){const s=+(base+base*.35*Math.sin((h-5)/24*Math.PI*2)+base*.08*(r()-.5)).toFixed(1);let p=s;
    if(bad[h]==='zero')p=0;if(bad[h]==='dup')p=prev;if(bad[h]==='x10')p=s*10;if(bad[h]==='miss')p=null;
    rows.push({h,s,p,bad:!!bad[h]});prev=s}
  return rows;
}

    ...(closed?[['good','Corrección aplicada: '+(r[2]==='Atraso'?'relanzamiento de la carga':r[2]==='Versión faltante'?'versión recuperada del FTP alterno':r[2]==='Configuración'?'configuración actualizada':'recarga del rango afectado'),r[7]],['good','Verificado automáticamente en la siguiente ejecución',r[7]]]:[])];
  const change=r[2]==='Atraso'||r[2]==='Versión faltante'?`  conjunto: ${r[1].toLowerCase().replace(/[^a-z0-9]+/g,'_')}\n<span class="del">- delta_dias: 1</span>\n<span class="add">+ delta_dias: 4        # temporal para el recargue</span>\n${closed?`<span class="del">- delta_dias: 4</span>\n<span class="add">+ delta_dias: 1        # revertido automáticamente</span>`:''}`:r[2]==='Configuración'?`<span class="del">- FROM MEM.OFERTA_DESPACHO_IDEAL</span>\n<span class="add">+ FROM MEM.OFERTA_DESP_IDEAL_V2</span>`:null;
  drawer(id,`<div style="display:flex;gap:8px;flex-wrap:wrap">${sev(r[3])}<span class="tag">${r[4]}</span>${r[11]>1?chip('warn',r[11]+'.ª vez este mes'):''}</div>
    <h3 style="margin:0;font-size:17px">${r[1]}</h3>
    <dl class="kv"><dt>Tipo</dt><dd>${r[2]}</dd><dt>Causa raíz</dt><dd>${r[5]}</dd><dt>Responsable</dt><dd>${r[9]}</dd><dt>Estado</dt><dd>${r[10]}</dd><dt>Resolución</dt><dd class="mono">${r[8]||'En curso'}</dd></dl>
    <h3 style="margin:6px 0 0;font-size:14px">Línea de tiempo</h3><ol class="tl">${ev.map(e=>`<li class="${e[0]}"><i></i><div><div class="t">${e[1]}</div><div class="m">${e[2]}</div></div></li>`).join('')}</ol>
    ${change?`<h3 style="margin:6px 0 0;font-size:14px">Cambios de configuración asociados</h3><pre class="code">${change}</pre>`:''}`,
    `<button class="btn" data-close>Cerrar</button>${!closed&&INC.some(i=>i.id===id)?`<button class="btn primary" id="goInc">Abrir incidente</button>`:''}`);
  const g=$('#goInc');if(g)g.onclick=()=>{closeOverlay();openInc(id)};
}

/* ---------- 9. Credenciales ---------- */
const CRED=[{f:'Oracle XM',t:'Base de datos',len:12},{f:'API XM',t:'API',len:16},{f:'Datalake SIMEM',t:'Datalake',len:14},{f:'FTP alterno SIMEM',t:'FTP',len:10},{f:'Excel de agentes',t:'Archivo compartido',len:9}];
function vCred(){
  return `
  <div class="vh"><div><h1>Credenciales</h1><p>Administre los accesos a todas las fuentes que usa la herramienta de calidad. Las contraseñas siempre se muestran enmascaradas.</p></div></div>
  <section class="panel"><div class="panel-h"><h3>Mis Credenciales</h3><small>${CRED.length} fuentes</small></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fuente</th><th>Tipo</th><th style="text-align:right">Acciones</th></tr></thead><tbody>
  ${CRED.map((c,i)=>`<tr><td style="font-weight:600">${c.f}</td><td><span class="tag">${c.t}</span></td><td style="text-align:right"><button class="btn sm" data-cred="${i}" aria-label="Editar credencial de ${c.f}">${ic('edit')}Editar</button></td></tr>`).join('')}
  </tbody></table></div></section>
  <p class="muted" style="margin:0;font-size:12px">Prototipo: las contraseñas no se guardan ni se envían a ningún servicio. Guardar, validar y renovar son simulaciones.</p>`;
}
function bCred(){$$('[data-cred]').forEach(b=>b.onclick=()=>credDrawer(+b.dataset.cred))}
function credDrawer(i,msg=''){
  const c=CRED[i];
  drawer('Credencial · '+c.f,`
    <div class="field"><label for="cFuente">Fuente</label><input class="in" id="cFuente" value="${esc(c.f)}" readonly></div>
    <div class="field"><label for="cPass">Contraseña</label><input class="in mono" id="cPass" type="password" autocomplete="new-password" value="${'•'.repeat(c.len)}" aria-describedby="cHelp"><small id="cHelp" class="muted">Mínimo 8 caracteres. Escriba una nueva para reemplazarla.</small></div>
    <div id="cMsg" aria-live="polite">${msg}</div>`,
    `<button class="btn" id="cRenew">${ic('repeat')}Renovar</button><button class="btn" id="cVal">${ic('shield')}Validar</button><button class="btn primary" id="cSave">${ic('ok')}Guardar</button>`);
  const say=(k,t)=>{$('#cMsg').innerHTML=k?`<div class="result-box ${k==='ok'?'ok':''}" style="${k==='ok'?'':k==='bad'?'background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err)':'background:var(--surface-2)'}">${ic(k==='ok'?'ok':k==='bad'?'alert':'clock')}${t}</div>`:''};
  const pass=()=>$('#cPass').value;
  $('#cSave').onclick=()=>{const v=pass();if(!v){say('bad','La contraseña no puede estar vacía.');return}
    if(!/^•+$/.test(v)){if(v.length<8){say('bad','La contraseña debe tener al menos 8 caracteres.');return}c.len=v.length}
    say('ok','Cambios guardados (simulado). La contraseña no se almacena en el prototipo.');toast('Credencial de '+c.f+' guardada (simulado)')};
  $('#cVal').onclick=()=>{if(!pass()){say('bad','Escriba la contraseña antes de validar.');return}
    $('#cVal').disabled=true;say('wait','Validando acceso a '+c.f+' (simulado)…');setTimeout(()=>{$('#cVal').disabled=false;say('ok','Acceso válido (resultado simulado, no se contactó la fuente).')},1200)};
  $('#cRenew').onclick=()=>{$('#cRenew').disabled=true;say('wait','Renovando credencial (simulado)…');setTimeout(()=>{c.len=16;$('#cRenew').disabled=false;$('#cPass').value='•'.repeat(16);say('ok','Credencial renovada (simulado). No se generó ninguna contraseña real.');toast('Credencial de '+c.f+' renovada (simulado)')},1200)};
}

/* ---------- Superposiciones ---------- */
let lastFocus=null;
function bindClose(){$$('#overlay [data-close]').forEach(b=>b.onclick=closeOverlay)}
function modal(title,body,foot,wide){lastFocus=lastFocus||document.activeElement;$('#overlay').innerHTML=`<div class="scrim" id="scrim"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeOverlay()};bindClose();const f=$('#overlay .modal-b input, #overlay .modal-b select, #overlay .modal-b textarea, #overlay .modal-f .primary');if(f)f.focus()}
function drawer(title,body,foot,cls=''){lastFocus=lastFocus||document.activeElement;$('#overlay').innerHTML=`<div class="drawer-scrim" data-close></div><aside class="drawer ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:''}</aside>`;bindClose();$('#overlay .drawer .icon-btn').focus()}
function closeOverlay(){verSel=null;$('#overlay').innerHTML='';$$('.vcell.pick').forEach(x=>x.classList.remove('pick'));if(lastFocus&&document.contains(lastFocus))lastFocus.focus();lastFocus=null}
const isOpen=()=>$('#overlay').children.length>0;

function palette(){
  lastFocus=document.activeElement;
  const items=[...VIEWS.map(([k,t,i])=>({t,i,sub:'Pantalla',run:()=>go(k)})),...INC.map(i=>({t:i.set,i:ST[i.kind][1],sub:i.id,run:()=>openInc(i.id)})),...CFG.filter(c=>!INC.some(i=>i.set===c.n)).map(c=>({t:c.n,i:'cfg',sub:'Configuración',run:()=>go('configuracion')}))];
  $('#overlay').innerHTML=`<div class="scrim" id="scrim"><div class="palette" role="dialog" aria-modal="true" aria-label="Búsqueda"><div class="palette-in">${ic('search')}<input id="pq" placeholder="Buscar conjunto, incidente o pantalla…" autocomplete="off" aria-label="Buscar"><kbd>Esc</kbd></div><ul id="pl"></ul></div></div>`;
  let sel=0,list=items;
  const draw=()=>{const q=$('#pq').value.toLowerCase();list=items.filter(x=>(x.t+x.sub).toLowerCase().includes(q)).slice(0,12);sel=Math.min(sel,Math.max(0,list.length-1));
    $('#pl').innerHTML=list.map((x,k)=>`<li class="${k===sel?'on':''}" data-k="${k}">${ic(x.i)}<span>${x.t}</span><small>${x.sub}</small></li>`).join('')||'<li class="muted">Sin resultados</li>';
    $$('#pl li[data-k]').forEach(li=>li.onclick=()=>{closeOverlay();list[+li.dataset.k].run()})};
  draw();$('#pq').focus();$('#pq').oninput=()=>{sel=0;draw()};
  $('#pq').onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}if(e.key==='Enter'&&list[sel]){const x=list[sel];closeOverlay();x.run()}};
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeOverlay()};
}

/* ---------- Tema, atajos y arranque ---------- */
const root=document.documentElement;
function curTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintThemeBtn(){$('#themeBtn').innerHTML=curTheme()==='dark'?ic('sun'):ic('moon');$('#themeBtn').title=curTheme()==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro'}
try{const t=localStorage.getItem('simem-theme');if(t)root.dataset.theme=t}catch(e){}
paintThemeBtn();
$('#themeBtn').onclick=()=>{const n=curTheme()==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('simem-theme',n)}catch(e){}paintThemeBtn()};
$('#bellBtn').onclick=()=>drawer('Notificaciones',[
  ['err','Generación real por recurso: registros faltantes','Crítica · hace 40 min','INC-2026-0411'],
  ['err','Vertimientos embalse ESMERALDA: 4 horas difieren','Alta · hace 2 h','INC-2026-0412'],
  ['clock','Precio de bolsa nacional sigue atrasado (3 días)','Crítica · hace 3 h','INC-2026-0409'],
  ['cfg','Delta temporal de Pérdidas del STN sin revertir','Alta · desde 12 sep','INC-2026-0399']
 ].map(([i,t,m,id])=>`<button class="notif btn ghost" style="height:auto;justify-content:flex-start;text-align:left;white-space:normal;border-radius:0" data-n="${id}">${ic(i)}<span>${t}<small>${m}</small></span></button>`).join(''),`<button class="btn" data-close>Cerrar</button>`)||$$('[data-n]').forEach(b=>b.onclick=()=>{closeOverlay();openInc(b.dataset.n)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const m=$('#kmenu');if(m&&!m.hidden){m.hidden=true;$('#kebab').setAttribute('aria-expanded','false');$('#kebab').focus();return}}
  if(e.key==='Escape'&&isOpen()){closeOverlay();return}
  const tg=e.target.tagName;if(isOpen()||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(tg))return;
  const n=+e.key;if(n>=1&&n<=VIEWS.length){go(VIEWS[n-1][0]);window.scrollTo(0,0)}
});
document.addEventListener('click',e=>{const m=$('#kmenu');if(m&&!m.hidden&&!e.target.closest('.kebab-wrap')){m.hidden=true;$('#kebab').setAttribute('aria-expanded','false')}});
window.addEventListener('hashchange',()=>{closeOverlay();render()});
render();
</script>
